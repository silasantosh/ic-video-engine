name: Scratch CC0 collector bootstrap test
on:
  push:
    branches: [scratch/media-collector-20261016]
    paths: ['.github/workflows/media-bootstrap.yml']
permissions:
  contents: write
concurrency:
  group: cc0-media-bootstrap
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: code
      - name: Apply supplied source-only collector patch
        working-directory: code
        run: |
          test "$(git branch --show-current)" = scratch/media-collector-20261016
          python3 - <<'PYCODE'
          import base64,pathlib
          pathlib.Path('/tmp/collector.patch').write_bytes(base64.b64decode(''))
          pathlib.Path('/tmp/seed.tar.gz').write_bytes(base64.b64decode(''))
          PYCODE
          git apply --check /tmp/collector.patch
          git apply /tmp/collector.patch
          git config user.name 'media-collector[bot]'
          git config user.email 'actions@github.com'
          git add collectors/media .github/workflows/media-collect.yml
          git commit -m 'Add isolated CC0 collector for scratch runner test'
          git push origin HEAD:scratch/media-collector-20261016
      - name: Create source-only queue orphan branch
        working-directory: code
        run: |
          if git ls-remote --exit-code --heads origin media-queue; then
            echo 'media-queue exists; stop rather than overwrite'
            exit 1
          fi
          git worktree add --orphan media-queue ../collection-state
          cd ../collection-state
          tar -xzf /tmp/seed.tar.gz
          git add .gitignore queue state
          git commit -m 'Initialize empty CC0 source queue'
          git push origin HEAD:media-queue
      - name: Parser safety tests
        run: python3 code/collectors/media/test_collect.py
      - name: Bounded collection with restart support
        env:
          MEDIA_COLLECTOR_HOME: ${{ github.workspace }}/collection-state
          COLLECT_MAX_PER_SITE: '2'
        run: bash code/collectors/media/run.sh
      - name: Validate source-only queue
        run: |
          python3 - <<'PYCODE'
          import json,collections
          from pathlib import Path
          x=json.loads(Path('collection-state/queue/media-queue.json').read_text())['entries']
          assert len(x)==len({e['source_page'] for e in x})
          for e in x:
            assert e['source'] in ('isorepublic.com','negativespace.co')
            assert e['licence']=='CC0' and e['collected_at']
          print('Validated',len(x),'unique CC0 records')
          print('Sources:',dict(collections.Counter(e['source'] for e in x)))
          print('Types:',dict(collections.Counter(e['media_type'] for e in x)))
          PYCODE
      - name: Persist queue and checkpoints
        if: always()
        working-directory: collection-state
        run: |
          git add queue state
          if ! git diff --cached --quiet; then
            git commit -m 'Update CC0 media queue and checkpoints [skip ci]'
            git push origin HEAD:media-queue
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cc0-media-queue
          path: |
            collection-state/queue/
            collection-state/logs/
          retention-days: 7
