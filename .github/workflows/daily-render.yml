name: Daily video render

# 12:30 PM IST short = 07:00 UTC | 6:30 PM IST lesson = 13:00 UTC
# GitHub Actions is free on public repos - Rs 0.
on:
  schedule:
    - cron: '0 7 * * *'
    - cron: '0 13 * * *'
  workflow_dispatch:
    inputs:
      day:
        description: 'Calendar day number (leave empty for today)'
        required: false
        type: string
      type:
        description: 'short or lesson'
        required: false
        type: string
        default: short

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Ensure Remotion Chrome
        run: npx remotion browser ensure

      - name: Pick calendar day and type
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            case "${{ github.event.schedule }}" in
              "0 13 * * *") TYPE=lesson ;;
              *) TYPE=short ;;
            esac
          else
            TYPE="${{ inputs.type || 'short' }}"
          fi
          if [ -n "${{ inputs.day }}" ]; then
            DAY=${{ inputs.day }}
          else
            START=$(date -u -d "$(jq -r .startDate content/shorts.json)" +%s)
            NOW=$(date -u +%s)
            DAY=$(( (NOW - START) / 86400 + 1 ))
          fi
          echo "day=$DAY" >> "$GITHUB_OUTPUT"
          echo "type=$TYPE" >> "$GITHUB_OUTPUT"

      - name: Generate voiceover (Sarvam Bulbul v3)
        env:
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
        run: node scripts/tts.mjs --day "${{ steps.pick.outputs.day }}" --type "${{ steps.pick.outputs.type }}"

      - name: Render video
        run: |
          npx remotion render src/index.ts ICShort \
            "out/day-${{ steps.pick.outputs.day }}-${{ steps.pick.outputs.type }}.mp4" \
            --props "{\"day\": ${{ steps.pick.outputs.day }}}"

      - name: Commit usage counter
        run: |
          git config user.name "ic-video-engine[bot]"
          git config user.email "actions@github.com"
          git add usage/usage.json
          git commit -m "usage: day ${{ steps.pick.outputs.day }} ${{ steps.pick.outputs.type }} [skip ci]" || true
          git pull --rebase origin main || true
          git push || true

      - uses: actions/upload-artifact@v4
        with:
          name: day-${{ steps.pick.outputs.day }}-${{ steps.pick.outputs.type }}
          path: out/*.mp4
          retention-days: 30
