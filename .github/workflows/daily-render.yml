name: Daily video render

# 12:30 PM IST short = 07:00 UTC (18:30 lesson slot on hold)
# GitHub Actions is free on public repos - Rs 0.
on:
  schedule:
    # 12:30 PM IST short only; 18:30 lesson slot held until lesson composition exists
    - cron: '0 7 * * *'
    # Recovery opportunity if GitHub drops/delays the primary cron. Ledger prevents duplicate posts.
    - cron: '17 7 * * *'
  workflow_dispatch:
    inputs:
      preflight_only:
        description: Readiness check only, no voice/render/publishing
        required: false
        type: boolean
        default: false
      day:
        description: 'Calendar day number (leave empty for today)'
        required: false
        type: string
      type:
        description: 'short, lesson (retired) or long'
        required: false
        type: string
        default: short

concurrency:
  group: daily-video
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  readiness:
    name: Content readiness (no credits or publishing)
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
      - name: Check content, budget and publication state
        id: check
        env:
          INPUT_DAY: ${{ inputs.day }}
          INPUT_TYPE: ${{ inputs.type }}
        run: |
          node <<'NODE'
          const fs=require('fs'),assert=require('node:assert/strict');
          const type=process.env.INPUT_TYPE||'short';
          const calFile=type==='long'?'content/longs.json':'content/shorts.json';
          const c=JSON.parse(fs.readFileSync(calFile));
          const u=JSON.parse(fs.readFileSync('usage/usage.json'));
          const p=JSON.parse(fs.readFileSync('usage/publishing.json'));
          const today=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Kolkata',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
          const day=Number(process.env.INPUT_DAY||Math.floor((Date.parse(today)-Date.parse(c.startDate))/86400000)+1);
          function assess(d,t,usage,state){
            if(t==='lesson')return 'held: lesson type retired; use long';
            if(['publishing','uncertain'].includes(state))return 'held: reconcile uncertain publication before retry';
            if(state==='published')return 'held: already published for this date';
            if(!d)return 'held: no content entry for this calendar day';
            if(!d.reviewed?.source)return 'held: content needs source review; do not bypass';
            if(!Array.isArray(d.lines_hi)||!d.lines_hi.length)return 'held: Hindi script missing';
            if(usage+d.lines_hi.join('\n').length>26000)return 'held: free voice safety reserve reached; no top-up';
            return 'ready';
          }
          const sample={reviewed:{source:'fixture'},lines_hi:['test']};
          assert.equal(assess({},'short',0,''),'held: content needs source review; do not bypass');
          assert.equal(assess(sample,'short',0,''),'ready');
          assert.match(assess(sample,'short',26000,''),/reserve/);
          assert.match(assess(sample,'short',0,'uncertain'),/uncertain/);
          assert.match(assess(sample,'lesson',0,''),/retired/);
          assert.equal(assess(sample,'long',0,''),'ready');
          assert.match(assess(undefined,'long',0,''),/no content/);
          assert.match(assess(sample,'short',0,'published'),/already/);
          assert.match(assess(undefined,'short',0,''),/no content/);
          const ledgerKey=type==='long'?today+'-long-youtube':today+'-short-instagram';
          const reason=assess(c.days.find(d=>d.day===day),type,u.total_chars,p[ledgerKey]?.state);
          const ready=reason==='ready';
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'ready='+ready+'\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,'## Daily video readiness\nDate: '+today+'; day: '+day+'; type: '+type+'\n\n'+reason+'\n\nNine preflight safety assertions passed. A held result is not a completed render or post.\n');
          console.log('Preflight tests passed. '+reason);
          NODE
  render:
    needs: readiness
    if: needs.readiness.outputs.ready == 'true' && inputs.preflight_only != true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Ensure Remotion Chrome
        run: npx remotion browser ensure

      - name: Pick calendar day and type
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            case "${{ github.event.schedule }}" in
              "0 13 * * *") TYPE=long ;;
              *) TYPE=short ;;
            esac
          else
            TYPE="${{ inputs.type || 'short' }}"
          fi
          if [ -n "${{ inputs.day }}" ]; then
            DAY=${{ inputs.day }}
          else
            CAL=content/shorts.json; [ "$TYPE" = "long" ] && CAL=content/longs.json
            START=$(date -u -d "$(jq -r .startDate $CAL)" +%s)
            NOW=$(date -u +%s)
            DAY=$(( (NOW - START) / 86400 + 1 ))
          fi
          echo "day=$DAY" >> "$GITHUB_OUTPUT"
          echo "type=$TYPE" >> "$GITHUB_OUTPUT"

      - name: Check content review and free credit budget
        run: |
          node -e 'const fs=require("fs");const f=process.env.TYPE==="long"?"./content/longs.json":"./content/shorts.json";const c=require(f);const d=c.days.find(d=>d.day===Number(process.env.DAY));if(!d?.reviewed?.source)throw Error("Content not source-reviewed");const u=JSON.parse(fs.readFileSync("usage/usage.json"));if(u.total_chars+d.lines_hi.join("\\n").length>26000)throw Error("Free credit safety reserve reached; no paid top-up");'
        env:
          DAY: ${{ steps.pick.outputs.day }}
          TYPE: ${{ steps.pick.outputs.type }}

      - name: Skip duplicate publication before consuming voice credits
        id: duplicate
        env:
          TYPE: ${{ steps.pick.outputs.type }}
        run: |
          node -e 'const fs=require("fs");const date=new Date().toLocaleDateString("en-CA",{timeZone:"Asia/Kolkata"});const p="usage/publishing.json";const r=fs.existsSync(p)?JSON.parse(fs.readFileSync(p)):{};const state=r[date+"-short-instagram"]?.state;if(process.env.TYPE==="short"&&["publishing","uncertain"].includes(state))throw Error("Previous publication uncertain; reconcile before retry");fs.appendFileSync(process.env.GITHUB_OUTPUT,"skip="+(process.env.TYPE==="short"&&state==="published")+"\n");'

      - name: Generate voiceover (Sarvam Bulbul v3)
        if: steps.duplicate.outputs.skip != 'true'
        env:
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
        run: node scripts/tts.mjs --day "${{ steps.pick.outputs.day }}" --type "${{ steps.pick.outputs.type }}"

      - name: Render video
        if: steps.duplicate.outputs.skip != 'true'
        run: |
          COMP=ICShort; [ "${{ steps.pick.outputs.type }}" = "long" ] && COMP=ICLong
          npx remotion render src/index.ts $COMP \
            "out/day-${{ steps.pick.outputs.day }}-${{ steps.pick.outputs.type }}.mp4" \
            --props "{\"day\": ${{ steps.pick.outputs.day }}}"

      - name: Phone-safe encode (limited-range yuv420p, faststart)
        if: steps.duplicate.outputs.skip != 'true'
        run: |
          SRC="out/day-${{ steps.pick.outputs.day }}-${{ steps.pick.outputs.type }}.mp4"
          npx remotion ffmpeg -y -i "$SRC" -c:v libx264 -pix_fmt yuv420p -crf 20 -preset medium -c:a copy -movflags +faststart "out/.phone-safe.mp4"
          mv "out/.phone-safe.mp4" "$SRC"

      - name: Commit usage counter
        if: steps.duplicate.outputs.skip != 'true'
        run: |
          git config user.name "ic-video-engine[bot]"
          git config user.email "actions@github.com"
          git add usage/usage.json
          git commit -m "usage: day ${{ steps.pick.outputs.day }} ${{ steps.pick.outputs.type }} [skip ci]" || true
          git pull --rebase origin main
          git push

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: debug-voice-day-${{ steps.pick.outputs.day }}
          path: public/voice/
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: steps.duplicate.outputs.skip != 'true'
        with:
          name: day-${{ steps.pick.outputs.day }}-${{ steps.pick.outputs.type }}
          path: out/*.mp4
          retention-days: 30

      - name: Publish reviewed Short to Instagram
        if: steps.pick.outputs.type == 'short' && steps.duplicate.outputs.skip != 'true'
        run: |
          if node -e 'const c=require("./content/shorts.json");process.exit(c.days.find(d=>d.day===Number(process.env.DAY))?.visualApproved ? 0 : 1)' ; then
            node scripts/publish-instagram.mjs "out/day-${{ steps.pick.outputs.day }}-short.mp4" "${{ steps.pick.outputs.day }}"
          else
            echo "Visual QA not approved; render saved, no post made."
          fi
        env:
          IG_ADMIN_KEY: ${{ secrets.IG_ADMIN_KEY }}
          DAY: ${{ steps.pick.outputs.day }}

      - name: Record failure for owner notifications
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Daily video failed: day ${{ steps.pick.outputs.day }} ${{ steps.pick.outputs.type }}" \
            --body "A daily render or Instagram publish failed. Check the run before retrying any uncertain publication: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. No paid retry or top-up is authorized."
