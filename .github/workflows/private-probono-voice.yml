name: Private Probono narration
on: workflow_dispatch
permissions:
  contents: write
concurrency:
  group: daily-video
  cancel-in-progress: false
jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Private narration only, never publish
        env:
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
        run: |
          cat > /tmp/voice.mjs <<'JS'
          import fs from 'node:fs';
          const text="काम संस्था का है, लेकिन दिन भर तलाश ही चलती रहे तो काम कब होगा? सोचिए, मीना एक छोटे एनजीओ में काम करती हैं। यह सिर्फ एक उदाहरण है। रसीदें सामने हैं, हिसाब सँभालना है। पर शुरुआत कहाँ से करें? वह इम्पैक्ट कनेक्ट खोलती हैं। यहाँ जरूरत के हिसाब से अलग रास्ते मिलते हैं। मेन्यू में पीपल एंड हेल्प चुनती हैं, फिर प्रो बोनो। अभी उन्हें हिसाब रखने वाला सॉफ्टवेयर समझना है। कंपनी का फ़िल्टर चुनकर ग्नू कैश खोजती हैं। जानकारी सामने आती है। सिर्फ नाम देखकर आगे नहीं बढ़तीं। पहले पात्रता पढ़ती हैं, फिर आधिकारिक वेबसाइट पर जाकर समझती हैं कि यह उनके काम से जुड़ता है या नहीं। अभी इंस्टॉल नहीं करतीं। वापस आकर बुकमार्क दबाती हैं। अब टीम के साथ बैठेंगी तो फिर से तलाश शुरू नहीं करनी पड़ेगी। सेव्ड में वही जानकारी मिल जाएगी। मीना की समस्या हल हो गई, ऐसा दावा नहीं। लेकिन अब खोज बिखरी हुई नहीं है। उनके पास जाँचने की जानकारी है, और टीम के साथ तय करने के लिए अगला कदम। इम्पैक्ट कनेक्ट। अपनी जरूरत से शुरू कीजिए, समझकर आगे बढ़िए।";
          const u=JSON.parse(fs.readFileSync('usage/usage.json'));if(u.total_chars+text.length>26000)throw Error('Free reserve reached');
          const r=await fetch('https://api.sarvam.ai/text-to-speech',{method:'POST',headers:{'api-subscription-key':process.env.SARVAM_API_KEY,'content-type':'application/json'},body:JSON.stringify({text,target_language_code:'hi-IN',speaker:'shreya',model:'bulbul:v3',speech_sample_rate:24000,enable_preprocessing:true})});if(!r.ok)throw Error('TTS HTTP '+r.status);const j=await r.json();if(!j.audios?.[0])throw Error('No audio');fs.mkdirSync('draft-audio',{recursive:true});fs.writeFileSync('draft-audio/probono.mp3',Buffer.from(j.audios[0],'base64'));u.total_chars+=text.length;u.total_requests++;u.log.push({ts:new Date().toISOString(),day:10,type:'private-correction',chars:text.length});fs.writeFileSync('usage/usage.json',JSON.stringify(u,null,2)+'\n');
          JS
          node /tmp/voice.mjs
          git config user.name 'ic-video-engine[bot]'
          git config user.email 'actions@github.com'
          git add usage/usage.json
          git commit -m 'usage: private Probono correction [skip ci]'
          git pull --rebase origin main
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: private-probono-narration
          path: draft-audio/probono.mp3
          retention-days: 3
